# Perfiles de riesgo del bot BTC 5m (Polymarket Up/Down).
# Todos los importes en USD. El modo por defecto es SIMULACION (paper);
# nada de esto opera con dinero real sin --execute y credenciales.

profiles:
  conservative:
    threshold: 0.70              # ask minimo del lado favorito para entrar
    min_entry_seconds_left: 60   # no entrar con menos de 60s restantes
    max_entry_seconds_left: 150  # ventana de entrada: ~2 min antes del cierre
    btc_move_min_usd: 70         # impulso minimo de BTC en el intervalo
    require_btc_move: true
    max_spread: 0.03
    min_top_ask_notional_usd: 30
    stake_usd: 5
    stop_loss_pct: 0.25
    exit_mode: hold              # hold = esperar resolucion (sin pagar spread de salida)
    exit_before_sec: 20
    session_minutes: 60
    daily_max_loss_usd: 15
    max_trades_per_day: 12

  aggressive:
    threshold: 0.70
    min_entry_seconds_left: 60
    max_entry_seconds_left: 150
    btc_move_min_usd: 70
    require_btc_move: true
    max_spread: 0.03
    min_top_ask_notional_usd: 30
    stake_usd: 10
    stop_loss_pct: 0.30
    exit_mode: hold
    exit_before_sec: 20
    session_minutes: 60
    daily_max_loss_usd: 25
    max_trades_per_day: 20

  # Replica del comportamiento real del repo original Novals83
  # (solo umbral de precio, sin filtro de impulso, salida antes del cierre).
  novals83_original:
    threshold: 0.70
    min_entry_seconds_left: 60
    max_entry_seconds_left: 300
    btc_move_min_usd: 0
    require_btc_move: false
    max_spread: 1.0
    min_top_ask_notional_usd: 0
    stake_usd: 5
    stop_loss_pct: 0.25
    exit_mode: before_close
    exit_before_sec: 20
    session_minutes: 60
    daily_max_loss_usd: 15
    max_trades_per_day: 12
